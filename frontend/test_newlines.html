<!DOCTYPE html>
<html>
<head>
    <title>Test Newlines</title>
</head>
<body>
    <h2>测试换行符</h2>
    <p>手动设置多行文本:</p>
    <textarea id="manual" rows="5" cols="50" style="white-space: pre;">SELECT 1
FROM t1;</textarea>
    <hr>
    <p>通过API获取:</p>
    <textarea id="api" rows="5" cols="50" style="white-space: pre;"></textarea>
    <button onclick="fetchFromAPI()">获取</button>
    <hr>
    <p>调试信息:</p>
    <pre id="debug"></pre>
    <script>
        async function fetchFromAPI() {
            const response = await fetch('http://localhost:8888/format/v4fixed', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sql: 'SELECT 1 FROM t1',
                    keyword_case: 'upper'
                })
            });
            const data = await response.json();
            // v4fixed API 返回 { formatted: "...", success: true }
            const formatted = data.formatted || data.formatted_sql || '';
            document.getElementById('api').value = formatted;
            document.getElementById('debug').textContent =
                'response: ' + JSON.stringify(data, null, 2) + '\n' +
                'formatted: ' + JSON.stringify(formatted) + '\n' +
                'length: ' + formatted.length + '\n' +
                'newlines count: ' + (formatted.match(/\n/g) || []).length;
        }
    </script>
</body>
</html>
